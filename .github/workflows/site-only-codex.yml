name: Publish Virtuagil site only (main, isolated)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-only-codex.yml"
      - "institucional-site/web/**"
concurrency:
  group: virtuagil-site-production-release
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate site
        working-directory: institucional-site/web
        run: |
          npm ci
          node --test tests/*.test.cjs
          npm run lint
          npm run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./institucional-site/web
          file: ./institucional-site/web/Dockerfile
          push: true
          tags: ghcr.io/fabioabdodev/iot-virtuagil-api/institucional-site:codex-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_WHATSAPP_URL=https://wa.me/553171029727
            NEXT_PUBLIC_CONTACT_EMAIL=contato@virtuagil.com.br
      - name: Release site only to Swarm
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_IMAGE: ghcr.io/fabioabdodev/iot-virtuagil-api/institucional-site:codex-${{ github.sha }}
          REGISTRY_USER: ${{ secrets.GHCR_USERNAME }}
          REGISTRY_TOKEN: ${{ secrets.GHCR_TOKEN }}
        with:
          host: 200.141.18.214
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: DEPLOY_IMAGE,REGISTRY_USER,REGISTRY_TOKEN
          script: |
            set -eu
            test "$(hostname -s)" = srv2080409
            SERVICE=virtuagil-site_virtuagil-site
            test "$(docker service ls --format '{{.Name}}|{{.Replicas}}' | grep -F "$SERVICE|1/1")" = "$SERVICE|1/1"
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin >/dev/null 2>&1
            docker pull "$DEPLOY_IMAGE" >/dev/null
            docker service update --detach=false --update-failure-action rollback --with-registry-auth --image "$DEPLOY_IMAGE" "$SERVICE"
            docker service ls --format '{{.Name}}|{{.Replicas}}' | grep -F "$SERVICE|1/1"
            OK=0
            for i in $(seq 1 25); do
              if curl -fsSL --max-time 8 https://virtuagil.com.br/ >/dev/null 2>&1 && curl -fsSL --max-time 8 https://www.virtuagil.com.br/ >/dev/null 2>&1; then OK=1; break; fi
              sleep 2
            done
            if [ "$OK" != "1" ]; then
              echo SITE_HEALTH_FAILED_ROLLING_BACK
              docker service rollback --detach=false "$SERVICE"
              exit 1
            fi
            echo SITE_RELEASE_HTTP_OK
