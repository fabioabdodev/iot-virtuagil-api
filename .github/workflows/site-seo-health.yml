name: SEO e Conversao Jade - Producao

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["deploy"]
    types: [completed]

permissions:
  contents: read

jobs:
  seo:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Verificar script SEO
        run: node --check institucional-site/web/scripts/seo-health.mjs
      - name: Aguardar estabilizacao breve do roteamento apos deploy
        run: sleep 12
      - name: Auditar site publicado, indexacao e Jade
        run: node institucional-site/web/scripts/seo-health.mjs
      - name: Notificar URLs atualizadas ao Bing e buscadores IndexNow (gratuito)
        continue-on-error: true
        run: |
          node --check institucional-site/web/scripts/indexnow.mjs
          node institucional-site/web/scripts/indexnow.mjs
