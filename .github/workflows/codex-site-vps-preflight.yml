name: Codex isolated site VPS preflight
on:
  push:
    branches: [review/codex-site-20261027]
    paths:
      - ".github/workflows/codex-site-vps-preflight.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/review/codex-site-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect site-only Swarm service without writing or revealing env values
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 200.141.18.214
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 5m
          script: |
            set -eu
            printf 'HOSTNAME=%s\n' "$(hostname -s)"
            test "$(hostname -s)" = "srv2080409"
            python3 - <<'PY'
            import json,subprocess,pathlib
            svc='virtuagil-site_virtuagil-site'
            p=subprocess.run(['docker','service','inspect',svc],capture_output=True,text=True,check=True)
            j=json.loads(p.stdout)[0]
            sp=j['Spec']
            tpl=sp['TaskTemplate']['ContainerSpec']
            envkeys=sorted(e.partition('=')[0] for e in tpl.get('Env',[]))
            print('SITE_PRECHECK '+json.dumps({
              'service':sp.get('Name'), 'image':tpl.get('Image'),
              'replicas_requested':sp.get('Mode',{}).get('Replicated',{}).get('Replicas'),
              'update_status':j.get('UpdateStatus',{}).get('State'),
              'env_keys':envkeys,
              'has_internal_key':bool([e for e in tpl.get('Env',[]) if e.startswith('VIRTUAGIL_INTERNAL_KEY=') and len(e)>len('VIRTUAGIL_INTERNAL_KEY=')]),
              'has_webhook_url':bool([e for e in tpl.get('Env',[]) if e.startswith('N8N_ASSISTENTE_CHECKOUT_WEBHOOK_URL=') and len(e)>len('N8N_ASSISTENTE_CHECKOUT_WEBHOOK_URL=')]),
              'has_site_stack_file':pathlib.Path('/opt/virtuagil-site/portainer-stack.yml').is_file(),
              'has_site_env_file':pathlib.Path('/opt/virtuagil-site/.env.prod').is_file()
            },ensure_ascii=False))
            PY
            docker service ps virtuagil-site_virtuagil-site --no-trunc --format '{{.Name}}|{{.CurrentState}}|{{.DesiredState}}' | head -4
            printf 'SITE_HTTP='
            curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}\n' https://virtuagil.com.br/
            printf 'SITE_WWW_HTTP='
            curl -sS -L --max-time 15 -o /dev/null -w '%{http_code}\n' https://www.virtuagil.com.br/
