name: Verify live site revision and startup
on:
  push:
    branches: [review/codex-site-20261027]
    paths: [.github/workflows/site-verify-codex.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect site health without mutation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 200.141.18.214
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -eu
            test "$(hostname -s)" = srv2080409
            S=virtuagil-site_virtuagil-site
            echo "LIVE_IMAGE=$(docker service inspect "$S" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
            docker service ls --format '{{.Name}}|{{.Replicas}}' | grep -F "$S|"
            C="$(docker ps --filter "label=com.docker.swarm.service.name=$S" --format '{{.ID}}' | head -1)"
            if [ -n "$C" ]; then
              echo "CONTAINER_HTTP=$(docker exec "$C" node -e "fetch('http://127.0.0.1:3000/').then(r=>console.log(r.status)).catch(e=>console.log('ERROR'))" | tail -1)"
            fi
            for U in https://virtuagil.com.br/ https://www.virtuagil.com.br/; do
              echo "PUBLIC_HTTP=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$U" || true)"
            done
